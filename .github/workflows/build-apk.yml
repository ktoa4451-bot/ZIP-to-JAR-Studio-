
name: Build ZIP-JAR Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Locate project
        id: project
        shell: bash
        run: |
          if [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "app/settings.gradle.kts" ]; then
            echo "dir=app" >> "$GITHUB_OUTPUT"
          else
            FILE="$(find . -name settings.gradle.kts \
              -not -path './.git/*' -print -quit)"
            if [ -z "$FILE" ]; then
              FILE="$(find . -name settings.gradle \
                -not -path './.git/*' -print -quit)"
            fi
            if [ -z "$FILE" ]; then
              echo "ERROR: Gradle settings file not found"
              exit 1
            fi
            echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Build debug APK
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          APK="$(find . -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"
          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Found APK: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIP-JAR-Studio-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          
