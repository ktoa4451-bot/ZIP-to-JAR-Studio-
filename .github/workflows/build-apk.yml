
name: Build ZIP-JAR Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -fsSL \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Extract source ZIP
        shell: bash
        run: |
          mkdir -p source
          if [ -f "ZIP-JAR-Studio-HTML-APK-Source.zip" ]; then
            unzip -q "ZIP-JAR-Studio-HTML-APK-Source.zip" -d source
          else
            echo "ERROR: ZIP-JAR-Studio-HTML-APK-Source.zip not found in repository root"
            exit 1
          fi

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          FILE="$(find source -name settings.gradle.kts -print -quit)"
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts not found in ZIP"
            exit 1
          fi
          echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: source
        run: |
          PROJECT_DIR="${{ steps.project.outputs.dir }}"
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZIP-JAR-Studio-APK
          path: source/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
